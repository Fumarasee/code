<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="HuskyHub — meet our pack of huskies: their stories, habits, photos and more." />
    <title>HuskyHub</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <canvas class="aurora__stars"></canvas>
      <div class="aurora__band aurora__band--1"></div>
      <div class="aurora__band aurora__band--2"></div>
      <div class="aurora__band aurora__band--3"></div>
      <div class="aurora__band aurora__band--4"></div>
      <div class="aurora__grain"></div>
    </div>

    <div class="scroll-edge" aria-hidden="true"></div>
    <header class="site-header glass glass--thick" id="site-header"></header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer" id="site-footer"></footer>

    <div id="gallery-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
